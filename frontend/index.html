<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="public/manifest.json">
  <title>VectorGuard AI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: rgb(65, 185, 165); color: #fff; font-family: system-ui, sans-serif; padding: 16px; margin: 0; }
    .container { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
    .header { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
    .logo { max-width: 140px; height: auto; border-radius: 16px; box-shadow: 0 0 24px rgba(0,0,0,.35); }
    .title { margin: 0; font-size: 1.4rem; letter-spacing: 0.02em; }
    .card { background: #FFFDD0; padding: 16px; border-radius: 12px; border: 1px solid #333; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .btn-red { background: #ff3b30; color: #fff; }
    .btn-blue { background: #0a84ff; color: #fff; margin-top: 12px; }
    .status-text { font-size: 1.1rem; color: #330606; margin: 4px 0; }
    .result-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
    .result-panel { display: flex; flex-direction: column; gap: 16px; min-height: 360px; }
    .accuracy-card { background: #fff; border: 1px solid #ccc; border-radius: 12px; padding: 14px; }
    .accuracy-title { margin: 0 0 8px; font-size: 1rem; font-weight: 700; color: #330606; }
    .indicator { width: 100%; height: 18px; background: #e5e5e5; border-radius: 999px; overflow: hidden; }
    .indicator-fill { height: 100%; width: 0; background: #34c759; transition: width 0.35s ease, background 0.35s ease; }
    .indicator-label { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; font-size: 0.95rem; color: #330606; }
    .map-frame { width: 100%; min-height: 300px; border: 1px solid #999; border-radius: 12px; }
    .result-summary { color: #330606; font-size: 0.95rem; line-height: 1.5; }
    .result-summary strong { color: #000; }
    @media (min-width: 860px) {
      .result-grid { grid-template-columns: 1fr 1fr; }
      .result-panel { min-height: 420px; }
    }
    @media (max-width: 640px) {
      body { padding: 12px; }
      .container { gap: 12px; }
      .card { padding: 14px; }
      .result-panel { min-height: auto; }
      .status-text { font-size: 1rem; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <img src="public/icons/CMU Africa Logo.png" alt="CMU Africa Logo" class="logo">
    <h2 class="title">VectorGuard AI Dashboard</h2>
  </div>
  

  <div class="card">
    <button class="btn btn-red" id="recordBtn">Start 30s Recording</button>
    <div id="timer" style="text-align: center; margin-top: 8px; color: #ff9500; display: none;">00:30</div>
    <p style="text-align:center; font-size: 1.2rem; color:#827831;">OR</p>
    <input type="file" style="color:#330606; font-size: 1.0rem;" id="audioFileInput" accept="audio/*">
  </div>

  <div class="card">
    <p class="status-text">GPS: <span id="gpsVal">Fetching...</span></p>
    <p class="status-text">Time: <span id="timeVal">--:--</span></p>
    <p class="status-text">
      Environment:
      <label><input type="radio" name="env" value="indoor" checked> Indoor</label>
      <label><input type="radio" name="env" value="outdoor"> Outdoor</label>
    </p>
    <button class="btn btn-blue" id="analyzeBtn">Analyze Acoustic Data</button>
  </div>

  <div class="card" id="resultCard" >
      <div class="result-grid">
        <div class="result-panel">
          <h3>Detection Breakdown</h3>
          <canvas id="pieChart"></canvas>
          <div class="accuracy-card">
            <p class="accuracy-title">Detection Confidence</p>
            <div class="indicator" aria-hidden="true">
              <div id="accuracyFill" class="indicator-fill"></div>
            </div>
            <div class="indicator-label">
              <span id="accuracyLabel">0%</span>
              <span id="accuracyText">Low confidence</span>
            </div>
          </div>
        </div>

        <div class="result-panel">
          <h3>Regional Detection Map</h3>
          <iframe id="mapFrame" class="map-frame" src="" title="Regional detection map"></iframe>
          <div class="result-summary">
            <p><strong>Location:</strong> <span id="mapCoords">Fetching...</span></p>
            <p><strong>Recorded at:</strong> <span id="mapTime">--:--</span></p>
            <p><strong>Environment:</strong> <span id="mapEnv">--</span></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</html>
